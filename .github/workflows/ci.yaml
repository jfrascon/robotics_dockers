name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
    - name: Install development dependencies
      run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
    - name: Run repository checks
        # Branch protection belongs to local commit creation, not CI checking
        # an already-created commit on the default branch.
      run: SKIP=no-commit-to-branch pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
    - name: Check out the repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install development dependencies
      run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
    - name: Run tests that do not require Docker
      run: pytest -q -m "not docker and not ros_image and not full_build"

  package:
    name: Build and inspect package
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
    - name: Build wheel and source distribution
      run: python -m pip install --upgrade pip build && python -m build
    - name: Install the wheel in a clean environment
      run: |
        python -m venv /tmp/robotics-dockers-package
        /tmp/robotics-dockers-package/bin/pip install dist/*.whl
    - name: Generate a context from the installed wheel
      run: |
        /tmp/robotics-dockers-package/bin/robotics-dockers new \
          jazzy ci-smoke:latest --output /tmp/robotics-context
        test -f /tmp/robotics-context/Dockerfile
        test -f /tmp/robotics-context/build.py
        test ! -f /tmp/robotics-context/compose_files/docker-compose.yaml

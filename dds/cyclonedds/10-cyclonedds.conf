# Increase the host-wide ceiling for receive socket buffers.
# Cyclone DDS can request a larger socket buffer up to this limit; this setting does not select
# the buffer size that Cyclone DDS requests.
# Source: https://docs.ros.org/en/rolling/How-To-Guides/DDS-tuning.html#cyclone-dds-tuning
# Place this file in /etc/sysctl.d/
# 2147483647 bytes = 2 GiB minus 1 byte.
net.core.rmem_max=2147483647

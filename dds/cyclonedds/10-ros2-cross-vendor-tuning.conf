# Reduce how long incomplete IPv4 fragments consume host memory.
# This shortens the interval during which dropped fragments can fill the reassembly buffer and
# prevent the host from receiving new fragments.
# Source: https://docs.ros.org/en/rolling/How-To-Guides/DDS-tuning.html#cross-vendor-tuning
# Place this file in /etc/sysctl.d/
# Retention time for incomplete IPv4 fragments, in seconds.
net.ipv4.ipfrag_time=3
# Increase the host-wide memory threshold for queued IPv4 fragments.
# 134217728 bytes = 128 MiB.
net.ipv4.ipfrag_high_thresh=134217728
